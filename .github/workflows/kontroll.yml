name: Kontrollera servern

# Startas manuellt. Hämtar en aktie från servern och visar vad som kom tillbaka.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Aktie att kontrollera"
        default: "NVDA"

permissions:
  contents: read

jobs:
  kontroll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Fråga servern
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          T: ${{ inputs.ticker }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          url = re.search(r'workerUrl:\s*"([^"]+)"', open("docs/config.js").read()).group(1)
          req = urllib.request.Request(f"{url}/api/stock?t={os.environ['T']}", headers={"X-App-Key": os.environ["APP_KEY"], "User-Agent": "aktieagent-kontroll"})
          try:
              d = json.load(urllib.request.urlopen(req, timeout=60))
          except urllib.error.HTTPError as e:
              print(f"::error title=Servern svarade {e.code}::{e.read().decode()[:500]}"); raise SystemExit(1)
          except Exception as e:
              print(f"::error title=Ingen kontakt::{e}"); raise SystemExit(1)
          ä = (d.get("nyckeltal") or {}).get("ägare")
          print(f"::notice title=Nyckeltal::{'finns' if d.get('nyckeltal') else 'SAKNAS'}")
          print(f"::notice title=Ägare::{json.dumps({k: v for k, v in (ä or {}).items() if k != 'största'}, ensure_ascii=False)}")
          print(f"::notice title=Största ägare::{len((ä or {}).get('största') or [])} st, förändring: {[o.get('förändring') for o in (ä or {}).get('största') or []][:4]}")
          print(f"::notice title=Ägarbetyg::{json.dumps(d.get('ägarbetyg'), ensure_ascii=False)[:900]}")
          print(f"::notice title=Hämtad::{d.get('hämtad')}")
          ping = json.load(urllib.request.urlopen(urllib.request.Request(f"{url}/api/ping", headers={"X-App-Key": os.environ["APP_KEY"], "User-Agent": "aktieagent-kontroll"}), timeout=30))
          sig = json.load(urllib.request.urlopen(urllib.request.Request(f"{url}/api/signal?t={os.environ['T']}", headers={"X-App-Key": os.environ["APP_KEY"], "User-Agent": "aktieagent-kontroll"}), timeout=60))
          print(f"::notice title=Signal::pris {sig.get('pris')} kursmål 3 år {(sig.get('horisonter') or {}).get('3')} utdelning {sig.get('utdelning')}")
          print(f"::notice title=App-kod::{'KORT (under 16 tecken)' if ping.get('svagKod') else 'stark'}")
          PY
