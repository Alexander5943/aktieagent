name: Topplista

# Rangordnar S&P 500 efter förväntad avkastning den 1:a varje månad (och när du startar den manuellt).
# Bevakningslistan sköts av servern (worker/), inte här.
on:
  schedule:
    - cron: "30 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: aktieagent

jobs:
  topplista:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera paket
        run: pip install -r requirements.txt

      - name: Screener (S&P 500, AI på topp 10)
        run: |
          python screener.py --ai-top 10 --out-dir docs/rapporter
          python screener.py --utvardera > docs/utvardering.txt || true

      - name: Uppdatera appens data
        run: python bygg_sajt.py

      - name: Spara
        run: |
          git config user.name "aktieagent"
          git config user.email "aktieagent@users.noreply.github.com"
          git add docs
          if [ -d historik ]; then git add historik; fi
          git diff --cached --quiet || git commit -m "Ny topplista $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
