name: Risklista

# Delar in alla amerikanska aktier i risknivå 1–10 (plus statspapper på nivå 0).
# Den 3:e varje månad (och när du startar den manuellt). Ingen AI – kostar inget.
on:
  schedule:
    - cron: "0 7 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: risk

jobs:
  risk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Återanvänd dagens hämtade nyckeltal (om körningen görs om samma dag)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: yahoo-${{ github.run_id }}
          restore-keys: yahoo-

      - name: Installera paket
        run: pip install -r requirements.txt

      - name: Kontrollera att risknivån räknas likadant som i appen
        run: python test_modell.py

      - name: Ta fram risklistan
        run: python risk.py

      - name: Spara hämtade nyckeltal till nästa körning
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: yahoo-${{ github.run_id }}

      - name: Spara
        run: |
          git config user.name "aktieagent"
          git config user.email "aktieagent@users.noreply.github.com"
          git add docs/data/risk.json
          git diff --cached --quiet || git commit -m "Risklista $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
