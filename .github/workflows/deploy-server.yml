name: Uppdatera servern

# Laddar upp servern (worker/) till Cloudflare när koden ändras, eller när du startar den manuellt.
on:
  push:
    branches: [main]
    paths: ["worker/src/**", "worker/wrangler.jsonc", "worker/package.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Kontrollera hemligheter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$APP_KEY" ] && missing="$missing APP_KEY"
          if [ -n "$missing" ]; then echo "::error::Dessa hemligheter saknas i GitHub:$missing"; exit 1; fi

      - name: Rensa konto-ID
        run: |
          # Plocka ut det 32 tecken långa ID:t, även om mellanslag eller en hel adress följt med
          id=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr 'A-F' 'a-f' | grep -oE '[a-f0-9]{32}' | head -1)
          if [ -z "$id" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID ser fel ut. Det ska vara 32 tecken (0-9 och a-f), t.ex. från adressen dash.cloudflare.com/<ID>."
            exit 1
          fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - name: Installera
        run: npm ci

      - name: Testa koden
        run: node test/test.mjs

      - name: Ladda upp till Cloudflare
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee deploy.log; then
            if grep -qi "subdomain" deploy.log; then
              echo "::error::Välj först en workers.dev-adress i Cloudflare: Compute → Workers & Pages."
            else
              echo "::error::Cloudflare avvisade uppladdningen. Se loggen ovan."
            fi
            exit 1
          fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Hittade ingen serveradress i svaret från Cloudflare."; exit 1; fi
          echo "URL=$url" >> "$GITHUB_ENV"
          echo "Servern finns på $url"

      - name: Spara hemligheter på servern
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          node -e 'console.log(JSON.stringify({ANTHROPIC_API_KEY: process.env.ANTHROPIC_API_KEY, APP_KEY: process.env.APP_KEY}))' > /tmp/s.json
          npx wrangler secret bulk /tmp/s.json
          rm /tmp/s.json

      - name: Koppla appen till servern
        run: |
          printf '// Fylls i automatiskt när servern deployas.\nwindow.AKTIE_CONFIG = { workerUrl: "%s" };\n' "$URL" > ../docs/config.js
          cd ..
          git config user.name "aktieagent"
          git config user.email "aktieagent@users.noreply.github.com"
          git add docs/config.js worker/wrangler.jsonc
          git diff --cached --quiet || git commit -m "Koppla appen till servern"
          git pull --rebase origin main
          git push
