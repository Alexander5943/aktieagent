name: Algoritmen

# Varje vardagskväll efter att börsen i New York stängt. Gratis (ingen AI).
# Tränar modellen på kursdata sedan 2005, testar den, ger alla aktier en poäng
# och fattar månadens köp- och säljbeslut för algoritmens portfölj.
on:
  schedule:
    - cron: "40 22 * * 1-5"
  workflow_dispatch:
    inputs:
      spara:
        description: "Spara resultatet i appen"
        type: boolean
        default: true
      data:
        description: "Spara kursdatan som fil (för utveckling)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: algoritm

jobs:
  algoritm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installera
        run: pip install -r requirements.txt

      - name: Kontrollera algoritmen med testdata
        run: python test_algoritm.py

      - name: Träna, testa och fatta beslut
        env:
          PYTHONIOENCODING: utf-8
        run: python -u algoritm.py ${{ (github.event_name == 'workflow_dispatch' && !inputs.spara) && '--out /tmp/algoritm.json' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.data) && '--spara-data /tmp/kurser.npz --utan-ovriga' || '' }}
        timeout-minutes: 35

      - name: Lägg kursdatan på en tillfällig gren
        if: github.event_name == 'workflow_dispatch' && inputs.data
        run: |
          git config user.name "aktieagent"
          git config user.email "aktieagent@users.noreply.github.com"
          git checkout -q --orphan data-tmp
          git rm -rfq .
          cp /tmp/kurser.npz .
          git add kurser.npz
          git commit -qm "Kursdata för utveckling (tillfällig)"
          git push -f origin data-tmp

      - name: Spara
        if: github.event_name != 'workflow_dispatch' || inputs.spara
        run: |
          git config user.name "aktieagent"
          git config user.email "aktieagent@users.noreply.github.com"
          git add docs/data/algoritm.json
          git diff --cached --quiet || git commit -m "Algoritmen $(date +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
          # Städa bort den tillfälliga grenen med kursdata om den finns kvar från utveckling
          git push origin --delete data-tmp 2>/dev/null || true
